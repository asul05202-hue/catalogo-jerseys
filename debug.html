<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Debug Login</title>
<style>
body{font-family:sans-serif;padding:20px;background:#111;color:#fff;}
input{width:100%;padding:10px;margin:8px 0;font-size:16px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;}
button{width:100%;padding:14px;background:#e63946;color:#fff;border:none;border-radius:8px;font-size:18px;cursor:pointer;margin-top:10px;}
#log{background:#1a1a1a;padding:10px;border-radius:6px;font-size:12px;margin-top:15px;white-space:pre-wrap;min-height:100px;word-break:break-all;}
</style>
</head>
<body>
<h2>Debug Login</h2>
<input id="ph" type="tel" placeholder="Telefono" value="3343745531"/>
<input id="pw" type="password" placeholder="Password" value="125670Carlos"/>
<button onclick="testLogin()">Probar</button>
<div id="log">Iniciando...</div>
<script>
var ADMIN_PHONE = '3343745531';
var ADMIN_PASS  = '125670Carlos';
var L = document.getElementById('log');
function log(m){ L.textContent += '\n' + m; }

window.onerror = function(msg,src,line,col,err){
  log('JS ERROR: ' + msg + ' (line ' + line + ')');
  return true;
};

function testLogin(){
  L.textContent = '';
  var phone = (document.getElementById('ph').value||'').trim().replace(/\D/g,'');
  var pass  = (document.getElementById('pw').value||'').trim();
  log('Phone: [' + phone + '] len=' + phone.length);
  log('Pass:  [' + pass + '] len=' + pass.length);
  log('Match phone: ' + (phone === ADMIN_PHONE));
  log('Match pass:  ' + (pass  === ADMIN_PASS));
  if(phone === ADMIN_PHONE && pass === ADMIN_PASS){
    log('>>> ADMIN OK <<<');
  } else {
    log('FALLO');
    for(var i=0;i<Math.max(pass.length,ADMIN_PASS.length);i++){
      if(pass[i]!==ADMIN_PASS[i]) log('Diff pos ' + i + ': [' + (pass[i]||'?') + '] vs [' + (ADMIN_PASS[i]||'?') + ']');
    }
  }
}

log('JS OK');
log('UA: ' + navigator.userAgent.substring(0,80));
</script>
</body>
</html>
